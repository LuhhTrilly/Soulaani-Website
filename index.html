<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Soulaani | The Culture. The People. The Platform.</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#050505;
  --black2:#090909;
  --panel:#101010;
  --panel2:#151515;
  --panel3:#1b1b1b;
  --gold:#d6ad55;
  --gold2:#f1d48a;
  --white:#f7f7f7;
  --muted:#929292;
  --border:rgba(255,255,255,.08);
  --green:#42d392;
  --red:#ff5c6c;
  --blue:#5da9ff;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at top right,rgba(214,173,85,.08),transparent 28%),
    var(--black);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:72px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:rgba(5,5,5,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:245px;
}

.brand-mark{
  width:39px;
  height:39px;
  border-radius:12px;
  background:linear-gradient(145deg,#f2d88d,#aa7d29);
  color:#080808;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:19px;
  box-shadow:0 5px 25px rgba(214,173,85,.18);
}

.brand-text{
  font-weight:800;
  letter-spacing:1.5px;
  color:var(--gold2);
  font-size:18px;
}

.search{
  flex:1;
  max-width:580px;
  margin:0 auto;
  position:relative;
}

.search input{
  width:100%;
  height:43px;
  border-radius:22px;
  border:1px solid var(--border);
  background:#111;
  color:white;
  padding:0 18px 0 45px;
  outline:none;
}

.search input:focus{
  border-color:rgba(214,173,85,.5);
  box-shadow:0 0 0 3px rgba(214,173,85,.07);
}

.search-icon{
  position:absolute;
  left:17px;
  top:10px;
  color:var(--muted);
  font-size:19px;
}

.top-actions{
  min-width:245px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#111;
  color:white;
  display:grid;
  place-items:center;
  transition:.2s;
}

.icon-btn:hover{
  border-color:rgba(214,173,85,.5);
  color:var(--gold2);
  transform:translateY(-1px);
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:
    linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),
    url("https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=200&q=80")
    center/cover;
  border:2px solid rgba(214,173,85,.55);
}

/* =========================
   LAYOUT
========================= */

.app{
  display:flex;
  padding-top:72px;
}

.sidebar{
  position:fixed;
  left:0;
  top:72px;
  bottom:0;
  width:245px;
  padding:22px 15px;
  border-right:1px solid var(--border);
  background:#070707;
  overflow:auto;
}

.main{
  width:100%;
  margin-left:245px;
  padding:25px 25px 100px;
}

.sidebar-title{
  color:#666;
  font-size:11px;
  letter-spacing:1.7px;
  text-transform:uppercase;
  margin:8px 12px 12px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav-item{
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:13px;
  padding:12px 13px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  width:100%;
  transition:.2s;
}

.nav-item:hover{
  background:#111;
  color:white;
}

.nav-item.active{
  color:var(--gold2);
  background:linear-gradient(90deg,rgba(214,173,85,.12),transparent);
  box-shadow:inset 2px 0 var(--gold);
}

.nav-icon{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#151515;
  font-size:16px;
}

.nav-label{
  font-size:14px;
  font-weight:600;
}

/* =========================
   PAGES
========================= */

.page{
  display:none;
  max-width:1100px;
  margin:auto;
}

.page.active{
  display:block;
}

.page-header{
  margin-bottom:22px;
}

.page-header h1{
  font-size:34px;
  margin-bottom:7px;
}

.page-header p{
  color:var(--muted);
}

/* =========================
   STORIES
========================= */

.stories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:20px;
}

.story{
  min-width:108px;
  height:155px;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  border:1px solid var(--border);
  background:#121212;
  cursor:pointer;
}

.story img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 45%,rgba(0,0,0,.9));
}

.story-name{
  position:absolute;
  z-index:2;
  bottom:10px;
  left:9px;
  font-size:12px;
  font-weight:700;
}

.story-add{
  position:absolute;
  top:8px;
  left:8px;
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--gold);
  color:#111;
  display:grid;
  place-items:center;
  font-weight:900;
  z-index:3;
}

/* =========================
   COMPOSER
========================= */

.composer{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-bottom:20px;
}

.composer-top{
  display:flex;
  gap:12px;
}

.composer textarea{
  flex:1;
  min-height:45px;
  resize:none;
  border:1px solid var(--border);
  border-radius:13px;
  background:#171717;
  color:white;
  padding:13px 15px;
  outline:none;
}

.composer textarea:focus{
  border-color:rgba(214,173,85,.5);
}

.composer-tools{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.tools{
  display:flex;
  gap:7px;
}

.tool-btn{
  border:0;
  background:#171717;
  color:#aaa;
  border-radius:10px;
  padding:9
