<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Soulaani | The Culture. The People. The Platform.</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#070707;
  --dark:#0d0d0d;
  --card:#121212;
  --card2:#171717;
  --gold:#d6a84f;
  --gold2:#f0c76a;
  --white:#f5f5f5;
  --muted:#999;
  --border:#252525;
  --green:#49c879;
  --red:#e65c5c;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,7,7,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  min-height:76px;
  padding:0 28px;
  display:flex;
  align-items:center;
  gap:30px;
}

.logo{
  color:var(--gold);
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:#fff;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:5px;
  flex:1;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#aaa;
  padding:12px 13px;
  border-radius:10px;
  transition:.2s;
}

.nav-btn:hover,
.nav-btn.active{
  color:#fff;
  background:#171717;
}

.nav-btn.active{
  color:var(--gold2);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:#111;
  color:#ddd;
  border-radius:50%;
}

.icon-btn:hover{
  border-color:#555;
}

.profile-mini{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#333,#111);
  border:1px solid #444;
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-weight:800;
}

/* =========================
   MOBILE NAV
========================= */

.mobile-nav{
  display:none;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1400px;
  margin:auto;
  padding:30px 28px 100px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:410px;
  border:1px solid var(--border);
  border-radius:25px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:flex-end;
  margin-bottom:25px;
  background:
    radial-gradient(circle at 75% 20%,rgba(214,168,79,.18),transparent 30%),
    radial-gradient(circle at 20% 80%,rgba(214,168,79,.08),transparent 35%),
    linear-gradient(135deg,#151515,#080808 65%);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.05)),
    repeating-linear-gradient(
      135deg,
      transparent 0,
      transparent 35px,
      rgba(255,255,255,.015) 36px,
      rgba(255,255,255,.015) 37px
    );
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:750px;
  padding:50px;
}

.eyebrow{
  color:var(--gold2);
  font-size:12px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:14px;
}

.hero h1{
  font-size:clamp(42px,6vw,78px);
  line-height:.94;
  letter-spacing:-4px;
  margin-bottom:22px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  color:#bbb;
  font-size:17px;
  line-height:1.6;
  max-width:650px;
  margin-bottom:28px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
  border-radius:12px;
  padding:13px 20px;
  font-weight:800;
}

.primary-btn{
  background:var(--gold);
  color:#090909;
  border:1px solid var(--gold);
}

.primary-btn:hover{
  background:var(--gold2);
}

.secondary-btn{
  background:#171717;
  color:#fff;
  border:1px solid #333;
}

/* =========================
   SECTION HEADERS
========================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin:30px 0 15px;
}

.section-head h2{
  font-size:24px;
  letter-spacing:-.5px;
}

.section-head span{
  color:var(--gold);
  font-size:13px;
  font-weight:700;
}

/* =========================
   CARDS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.card:hover{
  border-color:#393939;
}

.card-body{
  padding:20px;
}

.card-title{
  font-weight:800;
  font-size:18px;
  margin-bottom:8px;
}

.card-text{
  color:#999;
  line-height:1.5;
  font-size:14px;
}

/* =========================
   FEED
========================= */

.feed-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:25px;
}

.feed{
  max-width:800px;
}

.post{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:18px;
  overflow:hidden;
}

.post-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:17px 18px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#333,#111);
  border:1px solid #444;
  color:var(--gold2);
  font-weight:900;
}

.user-info{
  flex:1;
}

.user-info strong{
  display:block;
  font-size:14px;
}

.user-info small{
  color:#777;
}

.more{
  color:#777;
  background:none;
  border:0;
  font-size:20px;
}

.post-image{
  height:350px;
  background:
    radial-gradient(circle at 30% 25%,rgba(214,168,79,.35),transparent 22%),
    radial-gradient(circle at 70% 70%,rgba(255,255,255,.08),transparent 25%),
    linear-gradient(135deg,#242424,#090909);
  display:grid;
  place-items:center;
  color:#555;
  font-size:60px;
}

.post-content{
  padding:18px;
}

.post-content p{
  color:#bbb;
  line-height:1.55;
}

.post-actions{
  display:flex;
  gap:8px;
  padding:0 18px 18px;
}

.post-action{
  border:0;
  background:#1a1a1a;
  color:#aaa;
  border-radius:10px;
  padding:9px 13px;
}

.post-action:hover{
  color:#fff;
}

/* =========================
   SIDEBAR
========================= */

.sidebar-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.sidebar-card h3{
  font-size:16px;
  margin-bottom:16px;
}

.trend{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #222;
}

.trend:last-child{
  border-bottom:0;
}

.trend strong{
  font-size:14px;
}

.trend span{
  color:#666;
  font-size:12px;
}

/* =========================
   CREATE POST
========================= */

.create-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

.create-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.create-input{
  flex:1;
  min-height:50px;
  background:#0c0c0c;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  color:#fff;
  outline:none;
}

.create-input:focus{
  border-color:var(--gold);
}

.create-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.create-tools{
  display:flex;
  gap:8px;
}

.tool{
  border:0;
  background:#1a1a1a;
  color:#999;
  padding:8px 10px;
  border-radius:9px;
}

/* =========================
   PEOPLE
========================= */

.people-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.person-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
  text-align:center;
}

.person-avatar{
  width:78px;
  height:78px;
  margin:0 auto 13px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#3a3a3a,#111);
  border:1px solid #444;
  color:var(--gold2);
  font-size:24px;
  font-weight:900;
}

.person-card strong{
  display:block;
  margin-bottom:4px;
}

.person-card span{
  color:#777;
  font-size:13px;
}

.follow-btn{
  margin-top:15px;
  width:100%;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  border-radius:10px;
  padding:10px;
  font-weight:700;
}

/* =========================
   FEATURE TILES
========================= */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  min-height:180px;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#1b1b1b,#0b0b0b);
}

.feature::before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(214,168,79,.08);
  top:-60px;
  right:-40px;
}

.feature-icon{
  font-size:30px;
  margin-bottom:15px;
}

.feature h3{
  position:relative;
  z-index:2;
  margin-bottom:5px;
}

.feature p{
  position:relative;
  z-index:2;
  color:#888;
  font-size:13px;
}

/* =========================
   CULTURE
========================= */

.location-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.location{
  border:1px solid var(--border);
  background:#111;
  color:#aaa;
  padding:10px 14px;
  border-radius:999px;
}

.location.active{
  color:#111;
  background:var(--gold);
  border-color:var(--gold);
}

.culture-banner{
  border:1px solid var(--border);
  border-radius:20px;
  padding:35px;
  background:
    radial-gradient(circle at 85% 20%,rgba(214,168,79,.16),transparent 25%),
    #111;
}

.culture-banner h2{
  font-size:38px;
  letter-spacing:-1.5px;
  margin-bottom:10px;
}

.culture-banner p{
  max-width:700px;
  color:#999;
  line-height:1.6;
}

/* =========================
   MARKET
========================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
}

.product-image{
  height:190px;
  background:
    radial-gradient(circle at 50% 35%,rgba(214,168,79,.2),transparent 25%),
    linear-gradient(145deg,#242424,#0c0c0c);
  display:grid;
  place-items:center;
  font-size:50px;
}

.product-info{
  padding:17px;
}

.product-info strong{
  display:block;
  margin-bottom:5px;
}

.price{
  color:var(--gold2);
  font-weight:800;
}

/* =========================
   SKATE
========================= */

.skate-hero{
  min-height:300px;
  border-radius:22px;
  border:1px solid var(--border);
  padding:35px;
  display:flex;
  align-items:flex-end;
  background:
    linear-gradient(to top,rgba(0,0,0,.9),transparent),
    radial-gradient(circle at 70% 35%,rgba(214,168,79,.16),transparent 30%),
    linear-gradient(135deg,#202020,#080808);
  margin-bottom:20px;
}

.skate-hero h1{
  font-size:50px;
  letter-spacing:-2px;
}

.skate-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.skate-card{
  min-height:220px;
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  background:#111;
  position:relative;
}

.skate-card-image{
  height:160px;
  display:grid;
  place-items:center;
  font-size:48px;
  background:
    linear-gradient(145deg,#222,#0b0b0b);
}

.skate-card-info{
  padding:14px;
}

.skate-card-info strong{
  display:block;
}

.skate-card-info span{
  color:#777;
  font-size:12px;
}

/* =========================
   DATE
========================= */

.date-panel{
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  background:
    radial-gradient(circle at 80% 20%,rgba(214,168,79,.13),transparent 25%),
    #111;
  margin-bottom:22px;
}

.date-panel h1{
  font-size:40px;
  margin-bottom:8px;
}

.date-panel p{
  color:#999;
  max-width:650px;
  line-height:1.6;
}

.date-filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.date-filter{
  padding:10px 15px;
  border-radius:999px;
  background:#191919;
  color:#aaa;
  border:1px solid #2d2d2d;
}

/* =========================
   BUILD
========================= */

.build-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.build-card{
  padding:24px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
}

.build-number{
  color:var(--gold);
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:18px;
}

.build-card h3{
  margin-bottom:8px;
}

.build-card p{
  color:#888;
  line-height:1.5;
  font-size:14px;
}

/* =========================
   SEARCH
========================= */

.search-box{
  width:100%;
  background:#101010;
  border:1px solid var(--border);
  border-radius:14px;
  color:#fff;
  padding:15px 18px;
  outline:none;
  margin-bottom:20px;
}

.search-box:focus{
  border-color:var(--gold);
}

/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--border);
  margin-top:50px;
  padding:35px 0;
  color:#666;
  text-align:center;
  font-size:13px;
}

.footer strong{
  color:var(--gold);
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:#f2f2f2;
  color:#080808;
  padding:12px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:3000;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
================
